<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystalline Entity</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://esm.sh/three';
        import { OrbitControls } from 'https://esm.sh/three/addons/controls/OrbitControls.js';

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;
        controls.minDistance = 3;
        controls.maxDistance = 15;

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // Atmosphere
        scene.fog = new THREE.Fog(0x050505, 5, 20);

        // Dynamic Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0xff00ff, 3, 100);
        scene.add(light1);
        const light2 = new THREE.PointLight(0x00ffff, 3, 100);
        scene.add(light2);
        const light3 = new THREE.PointLight(0xffff00, 3, 100);
        scene.add(light3);

        // Crystalline Entity
        const geometry = new THREE.IcosahedronGeometry(1.5, 5);
        const material = new THREE.MeshStandardMaterial({
            metalness: 1,
            roughness: 0.1,
            envMapIntensity: 0.9,
            flatShading: true,
        });
        const crystal = new THREE.Mesh(geometry, material);
        scene.add(crystal);

        const clock = new THREE.Clock();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Animate crystal
            crystal.rotation.x = elapsedTime * 0.1;
            crystal.rotation.y = elapsedTime * 0.2;

            // Animate material color "breathing" effect
            const breathing = Math.sin(elapsedTime * 0.8) * 0.5 + 0.5;
            material.emissive.setRGB(breathing * 0.1, breathing * 0.2, breathing * 0.5);

            // Animate lights
            light1.position.x = Math.sin(elapsedTime * 0.7) * 4;
            light1.position.y = Math.cos(elapsedTime * 0.5) * 4;
            light1.position.z = Math.cos(elapsedTime * 0.3) * 4;

            light2.position.x = Math.cos(elapsedTime * 0.3) * 4;
            light2.position.y = Math.sin(elapsedTime * 0.5) * 4;
            light2.position.z = Math.sin(elapsedTime * 0.7) * 4;

            light3.position.x = Math.sin(elapsedTime * 0.7) * 4;
            light3.position.y = Math.cos(elapsedTime * 0.3) * 4;
            light3.position.z = Math.sin(elapsedTime * 0.5) * 4;

            // Update controls
            controls.update();

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
