<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ballistics Solver — PhysicsMASTER</title>

  <!-- Import map: pins all Three.js module specifiers to 0.160.0 -->
  <script type="importmap">
  {
    "imports": {
      "three":                                         "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/controls/OrbitControls.js":        "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js",
      "three/addons/postprocessing/EffectComposer.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js",
      "three/addons/postprocessing/RenderPass.js":     "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js",
      "three/addons/postprocessing/SSAOPass.js":       "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/SSAOPass.js",
      "three/addons/postprocessing/UnrealBloomPass.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js",
      "three/addons/postprocessing/BokehPass.js":      "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/BokehPass.js",
      "three/addons/postprocessing/ShaderPass.js":     "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js"
    }
  }
  </script>

  <!-- seedrandom@3.0.5 IIFE — exposes Math.seedrandom globally -->
  <script src="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/seedrandom.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0d14;
      overflow: hidden;
      font-family: monospace;
      touch-action: none;
    }

    #app-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* Top overlay — pointer-events none for non-interactive */
    #overlay-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      pointer-events: none;
      z-index: 50;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    #app-title {
      color: rgba(100, 180, 255, 0.5);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      pointer-events: none;
      opacity: 0.35;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(100,200,255,0.8);
    }
    #crosshair::before { width: 1px; height: 100%; left: 50%; }
    #crosshair::after  { width: 100%; height: 1px; top: 50%; }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.6s;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      color: #6090c0;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .loading-bar-outer {
      width: 220px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #3070d0, #60c0ff);
      width: 0%;
      animation: loadProgress 1.8s ease-out forwards;
    }

    @keyframes loadProgress {
      from { width: 0%; }
      to   { width: 100%; }
    }

    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(100,180,255,0.4);
      font-size: 10px;
      letter-spacing: 1px;
      pointer-events: none;
      text-align: center;
      line-height: 1.9;
      transition: opacity 1.5s;
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loading-text">⚡ BALLISTICS SOLVER — INITIALIZING</div>
    <div class="loading-bar-outer"><div class="loading-bar-inner"></div></div>
    <div class="loading-text" style="font-size:10px;opacity:0.5">
      Three.js 0.160.0 · Dexie 3.2.4 · RK4 Solver · SoA Particles
    </div>
  </div>

  <!-- Main render canvas -->
  <canvas id="app-canvas"></canvas>

  <!-- Crosshair -->
  <div id="crosshair"></div>

  <!-- Title -->
  <div id="overlay-top">
    <div id="app-title">⚡ PhysicsMASTER &middot; Ballistics Solver v1.0</div>
  </div>

  <!-- Instructions -->
  <div id="instructions">
    Click terrain to place target &nbsp;&middot;&nbsp; Drag to orbit
    &nbsp;&middot;&nbsp; Scroll/pinch to zoom &nbsp;&middot;&nbsp;
    Then click ▶ Plan &amp; Fire
  </div>

  <!-- Hide loader and fade instructions -->
  <script type="module">
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) loader.classList.add('hidden');
      }, 1800);

      setTimeout(() => {
        const inst = document.getElementById('instructions');
        if (inst) inst.style.opacity = '0';
      }, 9000);
    });
  </script>

  <!-- App entry point -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
